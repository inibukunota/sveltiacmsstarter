# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: inibukunota/sveltiacmsstarter
  branch: main
  auth_methods:
    - token

media_libraries:
  all:
    transformations:
      raster_image:
        format: webp
        quality: 75
        width: 1200

  cloudflare_r2:
    access_key_id: 8bd8a09989f292faab5a32a8ea882599
    bucket: sveltiacms
    account_id: 4a33ba27978813f4429a8926bb73dc1d
    public_url: https://pub-22cc936b490e4cdd9f1daf33ea8ef037.r2.dev
    prefix: cms-uploads/

media_folder: /public/uploads
public_folder: /uploads

collections:
  - name: blog
    label: Blog
    label_singular: Post
    folder: /src/content/blog
    create: true
    fields:
      - label: Title
        name: title
        widget: string

      - label: Description
        name: description
        widget: text

      - label: Publish Date
        name: pubDate
        widget: datetime
        required: true

      - label: Updated Date
        name: updatedDate
        widget: datetime
        required: false

      - label: Hero Image
        name: heroImage
        widget: image
        required: false

      - label: Body
        name: body
        widget: richtext
        required: true
