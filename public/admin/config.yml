# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: inibukunota/sveltiacmsstarter
  branch: main
  auth_methods:
    - token

media_libraries:
  cloudflare_r2:
    access_key_id: https://4a33ba27978813f4429a8926bb73dc1d.r2.cloudflarestorage.com/sveltiacms
    bucket: sveltiacms
    account_id: 580e9f106c82dcae89e3fb8ead3594c7
    public_url: https://pub-22cc936b490e4cdd9f1daf33ea8ef037.r2.dev
    prefix: cms-uploads/

media_folder: /public/uploads
public_folder: /uploads

collections:
  - name: blog
    label: Blog
    label_singular: Post
    folder: /src/content/blog
    create: true
    fields:
      - label: Title
        name: title
        widget: string

      - label: Description
        name: description
        widget: text

      - label: Publish Date
        name: pubDate
        widget: datetime
        required: true

      - label: Updated Date
        name: updatedDate
        widget: datetime
        required: false

      - label: Hero Image
        name: heroImage
        widget: image
        required: false

      - label: Body
        name: body
        widget: richtext
        required: true
